<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>3人チャット</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--p:#121a2b;--p2:#1b263a;--line:#2b3850;--t:#edf2fa;--m:#9aa9bf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:var(--p2);color:var(--t);padding:9px 12px}button.primary{background:#1d4ed8}textarea,input,select{width:100%;background:var(--p);border:1px solid var(--line);border-radius:10px;color:var(--t);padding:10px}.app{min-height:100dvh;display:grid;grid-template-columns:210px minmax(0,1fr) 270px;gap:1px;background:var(--line)}aside,main{background:var(--bg);min-width:0}aside{padding:15px}.main{display:flex;flex-direction:column;min-height:100dvh}.sub,.small{font-size:12px;color:var(--m)}h2{font-size:15px;margin:22px 0 8px}.nav{width:100%;text-align:left;margin:3px 0}.top{padding:15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.top h1{font-size:17px;margin:0}.messages{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1;overflow:auto}.msg{max-width:95%;border:1px solid var(--line);background:var(--p);border-radius:14px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;align-self:flex-start}.msg.user{align-self:flex-end;background:#12294a}.msg.chatgpt{border-left:3px solid #79b8ff}.msg.muse{border-left:3px solid #d0a8ff}.meta{font-size:12px;color:var(--m);margin-bottom:6px;display:flex;justify-content:space-between}.composer{padding:12px;border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:105px 1fr;gap:8px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.card{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}.right textarea{margin:4px 0 8px;resize:vertical}.mobile{display:none}.empty{text-align:center;color:var(--m);margin:auto;padding:25px}@media(max-width:950px){.app{grid-template-columns:180px 1fr}.right{display:none}.right.show{display:block;position:fixed;right:0;top:0;bottom:0;width:min(320px,90vw);z-index:5;overflow:auto}}@media(max-width:620px){.app{display:block}.sidebar{display:none}.top{padding:11px}.messages{padding:11px}.composer{padding:10px}.row{grid-template-columns:1fr}.mobile{display:flex;gap:5px;padding:6px}.mobile button{flex:1;font-size:12px;padding:7px}.right.show{display:block}}
</style></head><body><div class="app"><aside class="sidebar"><b>🤖 3人チャット</b><div class="sub">API代ゼロ・手動連携</div><button class="primary" style="width:100%;margin-top:16px" id="new">＋ 新しい会話</button><h2>プロジェクト</h2><div class="card"><b>AI開発チーム</b><div class="sub">君・ChatGPT・Muse</div></div><h2>ツール</h2><button class="nav" id="openG">↗ ChatGPTを開く</button><button class="nav" id="openM">↗ Museを開く</button><h2>データ</h2><button class="nav" id="export">↓ JSONバックアップ</button><button class="nav" id="import">↑ JSON復元</button><input id="file" type="file" accept=".json,application/json" hidden><div class="card"><b>🔒 ローカル保存</b><p class="small">データはこのブラウザ内。別端末へはJSONで引き継ぎます。</p></div><p class="small">MVP v0.1</p></aside><main class="main"><header class="top"><div><h1>AI開発チームの会話</h1><div class="sub" id="count">0件の発言</div></div><button id="toggle">🧠 記憶・設定</button></header><div class="mobile"><button id="mG">ChatGPT ↗</button><button id="mM">Muse ↗</button><button id="mMem">記憶</button></div><section class="messages" id="messages"><div class="empty">🤝<h2>3人の作業部屋へようこそ</h2><p>君が発言し、ChatGPTとMuseの返答をコピーして戻そう。</p></div></section><section class="composer"><div class="row"><select id="speaker"><option value="user">君</option><option value="chatgpt">ChatGPT</option><option value="muse">Muse</option></select><textarea id="draft" rows="3" placeholder="メッセージを入力… (Ctrl/⌘ + Enterで保存)"></textarea></div><div class="actions"><button class="primary" id="send">発言を保存</button><button id="toG">ChatGPT用にコピー</button><button id="toM">Muse用にコピー</button><button id="clear">入力を消す</button></div><p class="small">AIへの送信と返答の取り込みは手動です。</p></section></main><aside class="right" id="right"><h2 style="margin-top:0">🧠 共有記憶</h2><div class="small">次回の指示文に含めるメモ</div><label class="small">長期目標</label><textarea id="goal" rows="3" placeholder="例：API代ゼロで3人チャット"></textarea><label class="small">決定事項</label><textarea id="decisions" rows="4" placeholder="例：最初は手動連携"></textarea><label class="small">雑談・好み・背景メモ</label><textarea id="context" rows="4" placeholder="残しておきたいメモ"></textarea><label class="small">次の作業</label><textarea id="next" rows="3" placeholder="次にやること"></textarea><button class="primary" style="width:100%" id="saveMem">記憶を保存</button><p class="small" id="status"></p><h2>連携設定</h2><label class="small">ChatGPT URL</label><input id="urlG" type="url" placeholder="https://chatgpt.com/"><label class="small">Muse URL</label><input id="urlM" type="url" placeholder="利用中のMuseのURL"><button style="width:100%;margin-top:8px" id="saveUrls">URLを保存</button><h2>注意</h2><p class="small">ログイン、クラウド同期、暗号化、自動送信機能はありません。共有端末では個人情報を保存しないでください。</p></aside></div>
<script>
const $=id=>document.getElementById(id),key='threePersonChat.v01',labels={user:'君',chatgpt:'ChatGPT',muse:'Muse'};let s;const def={messages:[],memory:{goal:'API代ゼロで君・ChatGPT・Museが一緒に開発できる作業部屋を作る。',decisions:'最初は本物のChatGPTとMuseを手動連携する。スマホとPCに対応。',context:'',next:'実際に使って改善点を見つける。'},urls:{g:'https://chatgpt.com/',m:''}};try{s={...def,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){s=structuredClone(def)}function save(){localStorage.setItem(key,JSON.stringify(s));$('count').textContent=s.messages.length+'件の発言 · このブラウザに保存中'}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let b=$('messages');b.innerHTML='';if(!s.messages.length)b.innerHTML='<div class="empty">🤝<h2>3人の作業部屋へようこそ</h2><p>君が発言し、ChatGPTとMuseの返答をコピーして戻そう。</p></div>';s.messages.forEach((m,i)=>{let e=document.createElement('article');e.className='msg '+m.who;e.innerHTML='<div class="meta"><span>'+labels[m.who]+'</span><span>'+new Date(m.time).toLocaleString()+'</span></div><div>'+esc(m.text)+'</div><div class="actions"><button data-copy="'+i+'">コピー</button><button data-del="'+i+'">削除</button></div>';b.appendChild(e)});b.querySelectorAll('[data-copy]').forEach(x=>x.onclick=()=>copy(s.messages[+x.dataset.copy].text));b.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{s.messages.splice(+x.dataset.del,1);save();render()});b.scrollTop=b.scrollHeight;save()}function add(who,text){if(!text.trim())return;s.messages.push({who,text:text.trim(),time:new Date().toISOString()});save();render()}async function copy(t){try{await navigator.clipboard.writeText(t);alert('コピーしました')}catch(e){prompt('手動でコピーしてください',t)}}function sync(){['goal','decisions','context','next'].forEach(k=>$(k).value=s.memory[k]||'');$('urlG').value=s.urls.g||'';$('urlM').value=s.urls.m||''}function memsave(){['goal','decisions','context','next'].forEach(k=>s.memory[k]=$(k).value);save();$('status').textContent='保存しました'}function promptFor(target){let recent=s.messages.slice(-16).map(m=>labels[m.who]+':\n'+m.text).join('\n\n'),mem=Object.entries(s.memory).filter(([k,v])=>v&&v.trim()).map(([k,v])=>({goal:'長期目標',decisions:'決定事項',context:'雑談・背景メモ',next:'次の作業'}[k])+': '+v).join('\n');return 'あなたはユーザー・ChatGPT・Museの3人チームの一員です。APIを使わない手動連携です。相手: '+target+'\n\n【共有記憶】\n'+(mem||'なし')+'\n\n【直近の会話】\n'+(recent||'なし')+'\n\n【今回の入力】\n'+($('draft').value.trim()||'直近の文脈を踏まえて次のアクションを提案してください')+'\n\n過去の決定と矛盾する場合は明示し、不明なことを作らず、具体的な次のアクションを示してください。'}function open(which){let u=s.urls[which];if(u&&/^https:\/\//i.test(u))window.open(u,'_blank','noopener,noreferrer');else alert('右側の設定に正しいURLを入力してください')}function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.href=u;a.download='three-person-chat-backup.json';a.click();URL.revokeObjectURL(u)}$('send').onclick=()=>{add($('speaker').value,$('draft').value);$('draft').value=''};$('draft').onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')$('send').click()};$('clear').onclick=()=>$('draft').value='';$('toG').onclick=()=>copy(promptFor('ChatGPT'));$('toM').onclick=()=>copy(promptFor('Muse'));$('saveMem').onclick=memsave;$('saveUrls').onclick=()=>{s.urls={g:$('urlG').value.trim()||'https://chatgpt.com/',m:$('urlM').value.trim()};save();alert('URLを保存しました')};$('openG').onclick=$('mG').onclick=()=>open('g');$('openM').onclick=$('mM').onclick=()=>open('m');$('toggle').onclick=$('mMem').onclick=()=>$('right').classList.toggle('show');$('export').onclick=backup;$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.messages)||!x.memory||!x.urls)throw Error();if(confirm('現在のデータを置き換えますか？')){s=x;save();sync();render();alert('復元しました')}}catch(z){alert('JSONバックアップを読み込めませんでした')}e.target.value=''};$('new').onclick=()=>{if(confirm('現在の会話をJSONバックアップして新しい会話を始めますか？')){backup();s.messages=[];save();render()}};sync();render();
</script></body></html>
